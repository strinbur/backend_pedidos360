server:
  port: 8081

spring:
  application:
    name: product
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/product_db}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/f2a31af8-f420-417d-b585-34f31769c272/v2.0
  rabbitmq:
    addresses: ${RABBIT_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBIT_USER:admin}
    password: ${RABBIT_PASSWORD:admin}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9095}
    consumer:
      group-id: product-sales
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
    listener:
      ack-mode: manual

app:
  security:
    audience: 8d14a1ab-3758-45e4-b409-a95f6b7442e3
  cors:
    # Origenes permitidos del frontend, separados por coma, SIN espacios y SIN "/" al final.
    # Para agregar otro origen: sumarlo dentro de las llaves, despues del ultimo.
    # NO borrar http://localhost:4200 (es el que usa el front en local).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://52.22.2.226}
  rabbit:
    exchanges:
      direct: shop.direct
      topic: shop.topic
      dlx: shop.dlx
    queues:
      stock: product.stock.queue
      stock-dlq: product.stock.dlq
      product-events: cart.product-events.queue
      product-events-dlq: cart.product-events.dlq
    routing-keys:
      stock-reduce: stock.reduce
      product-updated: product.updated
      product-deleted: product.deleted
      product-events-binding: product.*
  kafka:
    low-stock-threshold: 5
    topics:
      stock-low: stock.low
      orders-checkout: orders.checkout